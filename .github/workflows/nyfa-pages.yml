name: NYFA Fast Dashboard Snapshot

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nyfa-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public website files
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p public
          cp index.html bridge.js phase1-ui.js smart-map.js home-map-expand.js training-calendar.js nyfa-district-gallery.js nyfa-home-photo-banner.js nyfa-district-explorer.js favicon.png nyfa-share.png public/
      - name: Build up-to-date public data snapshot
        env:
          NYFA_PUBLIC_API_URL: 'https://script.google.com/macros/s/AKfycbw5_o8mL02CWGa3vNILnP4OIe6Mmr_8q7_daVj8VYlvIvMewa9CnhqiS83QmfFSGrCU/exec'
        run: python3 scripts/build_snapshot.py public/dashboard-snapshot.json

      # A gallery outage must not prevent publication of the dashboard figures.
      - name: Publish approved district photos
        continue-on-error: true
        timeout-minutes: 6
        env:
          NYFA_PUBLIC_API_URL: 'https://script.google.com/macros/s/AKfycbw5_o8mL02CWGa3vNILnP4OIe6Mmr_8q7_daVj8VYlvIvMewa9CnhqiS83QmfFSGrCU/exec'
        run: |
          python3 -m venv "$RUNNER_TEMP/nyfa-gallery-venv"
          "$RUNNER_TEMP/nyfa-gallery-venv/bin/python" -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          "$RUNNER_TEMP/nyfa-gallery-venv/bin/python" scripts/build_gallery.py public

      - name: Remove unconfirmed gallery outputs if publishing was interrupted
        run: |
          if [ ! -f public/gallery-snapshot.json ]; then
            rm -rf public/photo-assets
            printf '%s\n' '{"available":false,"photos":[],"missing":0}' > public/gallery-snapshot.json
          fi

      - name: Validate files, dashboard data and approved image assets
        run: python3 scripts/reliability_guardian.py build public

      # Test every candidate, including scheduled runs: a failed push must not
      # be published by the next scheduled synchronisation.
      - name: Cache browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: nyfa-playwright-1.56.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install browser test tools
        run: |
          python3 -m venv "$RUNNER_TEMP/nyfa-browser-venv"
          "$RUNNER_TEMP/nyfa-browser-venv/bin/python" -m pip install --disable-pip-version-check playwright==1.56.0
          "$RUNNER_TEMP/nyfa-browser-venv/bin/python" -m playwright install --with-deps chromium firefox webkit

      - name: Anonymous cross-browser deployment gate
        timeout-minutes: 12
        run: '"$RUNNER_TEMP/nyfa-browser-venv/bin/python" scripts/browser_guardian.py --root public'

      # Retain public approved numerical data only, never past photo assets.
      - name: Save dashboard-only recovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nyfa-dashboard-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/dashboard-snapshot.json
          retention-days: 7
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website and snapshot
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the updated website
        id: deploy
        uses: actions/deploy-pages@v4
